# =====================================================
# CPS v5.0 演出系统配置文件
# =====================================================
# 架构：四层导演金字塔 (4-Layer Pipeline)
#   L1: ODR Router → Channel (结局前置路由)
#   L2: Dual Bidder → ActionBone + ReactionBone (双轨竞标)
#   L3: Assembler → final_text (原子拼装)
#
# 降级匹配锁链（文档6机制3）：
#   T2_Perfect: 精确匹配 MotionStyle + DamageMaterial
#   T2.5_Decay: 仅匹配 MotionStyle（通过 4 大类通用模板实现）
#   T3_Fallback: 硬编码兜底
# =====================================================

# =====================================================
# ActionBone 库 (攻击方动作骨架)
# =====================================================
action_bones:
  # --- 光束类 (ENERGY) ---
  - bone_id: "act_beam_rifle"
    motion_style: "SHOOT_INSTANT"
    damage_material: "ENERGY"
    text_fragments:
      - "{attacker}锁定能量特征，随着电荷汇聚完毕，扣下扳机！"
      - "{attacker}的{weapon}瞄准系统锁定目标，随着扳机扣下，光束喷薄而出！"
      - "{attacker}稳稳地端起{weapon}，高能粒子在枪管中汇聚，射出一道毁灭的光芒！"
    anim_id: "anim_rifle_shoot"

  - bone_id: "act_beam_mega"
    motion_style: "SHOOT_MASSIVE"
    damage_material: "ENERGY"
    cooldown: 0
    weight: 1.0
    text_fragments:
      - "{attacker}的{weapon}开始充能，周围的空间因能量密度过高而扭曲，一道巨大的光束横扫战场！"
      - "能量读数突破临界值！{attacker}将{weapon}的出力推至极限，毁灭性的光束倾泻而出！"
      - "{attacker}的机体四周因能量聚集而扭曲，{weapon}蓄势待发，最终爆发出惊天动地的威力！"
    anim_id: "anim_mega_beam"

  - bone_id: "act_slash_light_energy"
    motion_style: "SLASH_LIGHT"
    damage_material: "ENERGY"
    text_fragments:
      - "{attacker}的光束军刀在空气中留下一道灼热的轨迹，向敌机斩去！"
      - "高温光束刃划破空气！{attacker}的{weapon}化作一道白色闪光！"
      - "{attacker}手中的{weapon}喷吐出炽热的高温粒子，斩向敌机！"
    anim_id: "anim_slash_fast_energy"

  - bone_id: "act_slash_heavy_energy"
    motion_style: "SLASH_HEAVY"
    damage_material: "ENERGY"
    text_fragments:
      - "{attacker}手中的{weapon}喷吐出炽热的高温粒子，将空气都烧得噼啪作响！"
      - "{attacker}挥舞着燃烧的{weapon}，一道熔金般的烈焰轨迹劈向敌机！"
      - "灼热的气浪扑面而来！{attacker}的{weapon}带着赤红的高温光芒斩下！"
    anim_id: "anim_slash_heavy_energy"

  - bone_id: "act_psycho_funnel"
    motion_style: "PSYCHO_WAVE"
    damage_material: "ENERGY"
    cooldown: 2
    weight: 1.0
    text_fragments:
      - "「去吧！」{attacker}的精神感应浮游炮化作无数光束，如暴雨般倾泻而下！"
      - "{attacker}的意识通过感应系统无限扩张，{weapon}同时锁定多个目标！"
      - "无数浮游炮在{attacker}的意志驱动下，从四面八方射出致命的光束！"
    anim_id: "anim_funnel"

  - bone_id: "act_aoe_burst"
    motion_style: "AOE_BURST"
    damage_material: "ENERGY"
    text_fragments:
      - "{attacker}启动了禁忌的武器序列，地平线上仿佛升起了第二颗太阳！"
      - "{attacker}将所有的能量倾注于这一次全域打击！"
    anim_id: "anim_aoe_burst"

  # --- 实弹类 (KINETIC) ---
  - bone_id: "act_rifle_kinetic"
    motion_style: "SHOOT_INSTANT"
    damage_material: "KINETIC"
    text_fragments:
      - "{attacker}的{weapon}瞄准系统锁定目标，枪口喷出火舌！"
      - "{attacker}扣下扳机，{weapon}发出有节奏的咆哮，弹壳飞舞！"
      - "{attacker}稳稳地端起{weapon}，精确点射，弹头呼啸而出！"
    anim_id: "anim_rifle_fullauto"

  - bone_id: "act_projectile_single"
    motion_style: "PROJ_SINGLE"
    damage_material: "KINETIC"
    text_fragments:
      - "{attacker}扣动扳机，{weapon}的退壳机排出一缕青烟，弹头呼啸而出！"
      - "{attacker}发射出一枚高速破甲弹，弹丸撕裂空气的声音在战场上空回荡！"
    anim_id: "anim_shoot_single"

  - bone_id: "act_heavy_cannon"
    motion_style: "SHOOT_MASSIVE"
    damage_material: "KINETIC"
    cooldown: 3
    weight: 0.3
    text_fragments:
      - "{attacker}的{weapon}发出雷鸣般的咆哮，巨大的后坐力让机体猛然后坐！"
      - "炮口制退器喷出炽热的火焰，{attacker}的{weapon}将毁灭性的弹丸投向目标！"
    anim_id: "anim_heavy_cannon"

  - bone_id: "act_projectile_rain"
    motion_style: "PROJ_RAIN"
    damage_material: "KINETIC"
    text_fragments:
      - "「覆盖前方区域！」{attacker}的{weapon}向前方喷吐出密集的火蛇！"
      - "{attacker}试图用压倒性的钢铁暴雨封锁目标的所有活动空间！"
      - "{attacker}的{weapon}喷吐出无休止的弹幕，将战场化作地狱！"
    anim_id: "anim_missile_rain"

  # --- 物理近战类 (PHYSICAL) ---
  - bone_id: "act_slash_light"
    motion_style: "SLASH_LIGHT"
    damage_material: "PHYSICAL"
    text_fragments:
      - "{attacker}身形一闪，{weapon}划出一道致命的弧线，斩向敌机！"
      - "{attacker}从腰间拔出{weapon}，机体已化作白色闪光，瞬间划破空气！"
      - "{attacker}以迅雷不及掩耳之势挥动{weapon}，向敌人发起致命斩击！"
    anim_id: "anim_slash_fast"

  - bone_id: "act_slash_heavy"
    motion_style: "SLASH_HEAVY"
    damage_material: "PHYSICAL"
    text_fragments:
      - "{attacker}将推进器出力推至极限，{weapon}划出一道足以撕裂大气层的弧光，劈向敌机！"
      - "{attacker}抡起沉重的{weapon}，以泰山压顶之势猛然砸下！"
      - "{attacker}的{weapon}在空中留下一道完美的、象征终焉的轨迹，狠狠斩下！"
    anim_id: "anim_slash_heavy"

  - bone_id: "act_strike_blunt"
    motion_style: "STRIKE_BLUNT"
    damage_material: "PHYSICAL"
    text_fragments:
      - "{attacker}加速重拳挥出，空气在高速移动的拳头前部形成了肉眼可见的激波！"
      - "{attacker}踏步出击，试图以雷霆万钧的重击击碎对方的防御！"
      - "{attacker}的重击精准击中了机体结构的结合点，造成剧烈震荡！"
    anim_id: "anim_strike"

  # --- 通用撞击类 (GENERIC) ---
  - bone_id: "act_impact_ram"
    motion_style: "IMPACT_RAM"
    damage_material: "GENERIC"
    text_fragments:
      - "{attacker}完全放弃了射击，将辅助推进器全部开启，机体化作一枚钢铁陨石撞向敌机！"
      - "{attacker}将推进器推至极限，以不可阻挡之势向{defender}冲去！"
      - "{attacker}的目标只有一个——{defender}的驾驶舱！全速撞击！"
    anim_id: "anim_collision"

# =====================================================
# ReactionBone 库 (防御方反应骨架)
# =====================================================
#
# 结构说明：
# 1. T2_Perfect 层：精确匹配 motion_style + damage_material 的特化模板
# 2. T2.5_Decay 层：4 大类 × 6 种 result = 24 个通用模板
# 3. FATAL 频道：特殊致死描述
#
# 4 大类动作分类 (MacroMotion)：
#   - RANGED_DIRECT: 定向直射 (SHOOT_INSTANT, PROJ_SINGLE)
#   - MELEE_CLASH: 近战格斗 (SLASH_*, STRIKE_BLUNT, IMPACT_RAM)
#   - RANGED_AOE: 大范围覆盖 (SHOOT_MASSIVE, PROJ_RAIN, AOE_BURST)
#   - OMNI_DIRECTIONAL: 全方位空间 (PSYCHO_WAVE)
# =====================================================

reaction_bones:
  # ==============================================================================
  # T2_Perfect 层：精确匹配模板 (motion_style + damage_material)
  # ==============================================================================

  # --- PSYCHO_WAVE 特化模板 (浮游炮全方位攻击) ---
  - bone_id: "react_psycho_miss"
    channel: "EVADE"
    motion_style: "PSYCHO_WAVE"
    damage_material: "ENERGY"
    attack_result: "MISS"
    text_fragments:
      - "浮游炮的光束交织成网，但{defender}从缝隙中穿过了！"
      - "无数光束从四面八方袭来，{defender}惊险地全部避开！"
      - "{defender}的感应系统捕捉到危险，提前脱离了浮游炮的包围圈！"
    vfx_ids: ["vfx_dodge_trail", "vfx_beam_nearmiss"]
    sfx_ids: ["sfx_dodge"]

  - bone_id: "react_psycho_dodge"
    channel: "EVADE"
    motion_style: "PSYCHO_WAVE"
    damage_material: "ENERGY"
    attack_result: "DODGE"
    text_fragments:
      - "浮游炮群的光束从四面八方射来，{defender}以惊人的机动性全部躲开！"
      - "{defender}在光束交织的死亡之网中穿梭，毫发无伤！"
    vfx_ids: ["vfx_dodge_trail"]
    sfx_ids: ["sfx_dodge"]

  - bone_id: "react_psycho_parry"
    channel: "EVADE"
    motion_style: "PSYCHO_WAVE"
    damage_material: "ENERGY"
    attack_result: "PARRY"
    text_fragments:
      - "{defender}的I-Field展开，将四面袭来的光束尽数弹开！"
      - "浮游炮的光束被{defender}的防御场偏转，化作战场上的流光！"
    vfx_ids: ["vfx_shield_glow", "vfx_beam_diffuse"]
    sfx_ids: ["sfx_shield_absorb"]

  - bone_id: "react_psycho_block"
    channel: "IMPACT"
    motion_style: "PSYCHO_WAVE"
    damage_material: "ENERGY"
    attack_result: "BLOCK"
    text_fragments:
      - "{defender}的I-Field全力展开，浮游炮的光束群在防御场上激起涟漪！"
      - "数道光束同时命中，但{defender}的抗光束涂层成功吸收了大部分伤害！"
    vfx_ids: ["vfx_shield_glow", "vfx_beam_diffuse"]
    sfx_ids: ["sfx_shield_absorb"]

  - bone_id: "react_psycho_crit"
    channel: "IMPACT"
    motion_style: "PSYCHO_WAVE"
    damage_material: "ENERGY"
    attack_result: "CRIT"
    text_fragments:
      - "{defender}的I-Field在全方位轰击下过载，{hit_part}承受了全部能量，装甲熔融，机体濒临机能停止！"
      - "立体光束网精准锁定{defender}的{hit_part}，高能粒子在装甲上烧出无数孔洞，机体冒着浓烟急速后退！"
      - "浮游炮的集束打击命中{defender}的{hit_part}，能量传导引发核心系统受损，机体发出绝望的红色警报！"
    vfx_ids: ["vfx_crit_impact", "vfx_beam_pierce", "vfx_core_meltdown"]
    sfx_ids: ["sfx_crit_energy", "sfx_alarm"]

  # ==============================================================================
  # RANGED_DIRECT + ENERGY (光束步枪/光束手枪)
  # ==============================================================================
  - bone_id: "react_beam_rifle_parry"
    channel: "EVADE"
    motion_style: "SHOOT_INSTANT"
    damage_material: "ENERGY"
    attack_result: "PARRY"
    text_fragments:
      - "{defender}的主动能盾瞬间展开，高能光束被偏转，在大气中留下一道耀眼的残迹！"
      - "光束被{defender}以极限操作避过要害，装甲边缘被烧灼出熔融的痕迹！"
      - "{defender}的姿态控制爆发性喷射，在光束命中的刹那完成了空间转移！"
    vfx_ids: ["vfx_beam_deflect", "vfx_armor_melt"]
    sfx_ids: ["sfx_beam_deflect", "sfx_armor_sizzle"]

  - bone_id: "react_beam_rifle_crit"
    channel: "IMPACT"
    motion_style: "SHOOT_INSTANT"
    damage_material: "ENERGY"
    attack_result: "CRIT"
    text_fragments:
      - "集束光命中{defender}的{hit_part}，装甲在高温下瞬间熔穿，内部系统发出刺耳的警报声！"
      - "光束贯穿{defender}的{hit_part}，造成的重创让机体平衡系统陷入混乱！"
      - "{defender}的{hit_part}被光束直接洞穿，机体剧烈震颤，各项数值急剧下降！"
    vfx_ids: ["vfx_crit_impact", "vfx_beam_pierce", "vfx_explosion_small"]
    sfx_ids: ["sfx_crit_energy", "sfx_alarm"]

  # ==============================================================================
  # RANGED_DIRECT + KINETIC (火箭炮/实弹步枪)
  # ==============================================================================
  - bone_id: "react_kinetic_rifle_parry"
    channel: "EVADE"
    motion_style: "SHOOT_INSTANT"
    damage_material: "KINETIC"
    attack_result: "PARRY"
    text_fragments:
      - "{defender}的倾斜装甲成功弹开了破甲弹，金属火花四溅中弹头被导向一旁！"
      - "实弹被{defender}以精妙的切入角度偏转，在装甲外侧拉出一条刺眼的火线！"
      - "{defender}在弹头逼近的瞬间启动喷射系统，机体被冲击波推出危险区域！"
    vfx_ids: ["vfx_ricochet", "vfx_armor_spark"]
    sfx_ids: ["sfx_ricochet", "sfx_metal_hit"]

  - bone_id: "react_kinetic_rifle_crit"
    channel: "IMPACT"
    motion_style: "SHOOT_INSTANT"
    damage_material: "KINETIC"
    attack_result: "CRIT"
    text_fragments:
      - "破甲弹直接命中{defender}的{hit_part}，装甲被撕裂成碎片，内部系统发出受损警报！"
      - "{defender}的{hit_part}被高速弹头贯穿，液压管爆裂，机体冒着烟雾失去平衡！"
      - "弹头钻入{defender}的{hit_part}，剧烈的冲击让机体在一瞬间失去了作战能力！"
    vfx_ids: ["vfx_crit_impact", "vfx_armor_pierce", "vfx_hydraulic_leak"]
    sfx_ids: ["sfx_crit_kinetic", "sfx_alarm"]

  # ==============================================================================
  # RANGED_DIRECT + KINETIC (火箭炮/单发实弹) - PARRY 特化
  # ==============================================================================
  - bone_id: "react_proj_single_parry"
    channel: "EVADE"
    motion_style: "PROJ_SINGLE"
    damage_material: "KINETIC"
    attack_result: "PARRY"
    text_fragments:
      - "{defender}的近防火神炮疯狂咆哮，在火箭弹逼近的瞬间将其凌空打爆！"
      - "火箭弹被{defender}以精妙的装甲倾角弹开，在大气中划出一道偏转的轨迹！"
      - "{defender}的 ECM 系统发出强力干扰，火箭弹的制导失灵，擦着机体飞向虚空！"
    vfx_ids: ["vfx_ricochet", "vfx_flak_burst", "vfx_ecm_wave"]
    sfx_ids: ["sfx_flak_fire", "sfx_ricochet", "sfx_ecm_jam"]

  # ==============================================================================
  # RANGED_AOE + ENERGY (扩散粒子炮/大型光束炮)
  # ==============================================================================
  - bone_id: "react_beam_aoe_parry"
    channel: "EVADE"
    motion_style: "SHOOT_MASSIVE"
    damage_material: "ENERGY"
    attack_result: "PARRY"
    text_fragments:
      - "{defender}的超高张力场在扩散光束面前展开，光束在防护罩上激起层层涟漪后被弹飞！"
      - "{defender}全速后撤冲出光束覆盖区，推进器的尾焰在光束照射下蒸发成等离子体！"
      - "光束扫过{defender}的瞬间，机体残像在大气中闪烁，那是超越极限的闪避留下的视觉残影！"
    vfx_ids: ["vfx_shield_glow", "vfx_beam_diffuse", "vfx_afterimage"]
    sfx_ids: ["sfx_shield_absorb", "sfx_beam_wave"]

  - bone_id: "react_beam_aoe_crit"
    channel: "IMPACT"
    motion_style: "SHOOT_MASSIVE"
    damage_material: "ENERGY"
    attack_result: "CRIT"
    text_fragments:
      - "扩散光束吞没{defender}的{hit_part}，装甲在大面积高温下严重变形，机体冒出滚滚浓烟！"
      - "{defender}的{hit_part}承受了光束风暴的直击，装甲表面熔融，内部系统全面受损！"
      - "巨型光束横扫而过，{defender}的{hit_part}被严重烧毁，机体冒着火花踉跄后退！"
    vfx_ids: ["vfx_crit_impact", "vfx_armor_melt", "vfx_smoke"]
    sfx_ids: ["sfx_crit_energy", "sfx_alarm"]

  # ==============================================================================
  # RANGED_AOE + KINETIC (导弹弹幕/火箭弹幕)
  # ==============================================================================
  - bone_id: "react_missile_parry"
    channel: "EVADE"
    motion_style: "PROJ_RAIN"
    damage_material: "KINETIC"
    attack_result: "PARRY"
    text_fragments:
      - "{defender}的近防火神炮疯狂咆哮，在空中构筑出一道密集的拦截网，导弹群在引爆中化作无害的烟花！"
      - "反导弹系统在千钧一发之际启动，{defender}用精确的点射在导弹群中撕开了一条生路！"
      - "{defender}的ECM系统发出强力干扰波，导弹群的制导全部失灵，在空中漫无目的地乱飞后坠毁！"
    vfx_ids: ["vfx_missile_intercept", "vfx_explosion_chain"]
    sfx_ids: ["sfx_vulcan_fire", "sfx_explosion_small"]

  - bone_id: "react_missile_crit"
    channel: "IMPACT"
    motion_style: "PROJ_RAIN"
    damage_material: "KINETIC"
    attack_result: "CRIT"
    text_fragments:
      - "数枚导弹在{defender}的{hit_part}附近引爆，冲击波将装甲撕开，机体冒着浓烟摇摇欲坠！"
      - "{defender}的{hit_part}被导弹弹幕直接命中，连环爆炸让装甲支离破碎，机体发出严重受损警报！"
      - "导弹群将{defender}的{hit_part}炸成筛子，碎片横飞中机体失去了作战能力，只能紧急撤退！"
    vfx_ids: ["vfx_crit_impact", "vfx_explosion_chain", "vfx_smoke"]
    sfx_ids: ["sfx_crit_kinetic", "sfx_alarm"]

  # ==============================================================================
  # MELEE_CLASH + ENERGY (光束军刀/光束斧)
  # ==============================================================================
  - bone_id: "react_beam_saber_parry"
    channel: "EVADE"
    motion_style: "SLASH_LIGHT"
    damage_material: "ENERGY"
    attack_result: "PARRY"
    text_fragments:
      - "两把光束军刀在极近距离交叉，磁场对抗产生的高温将周围的空气烧成等离子体！"
      - "{defender}以光束盾接住斩击，两股能量碰撞产生耀眼的电磁风暴，刺眼的闪光照亮整个战场！"
      - "光束刃被{defender}的I-Field强行弹开，能量反冲在双方装甲上都留下了熔融的痕迹！"
    vfx_ids: ["vfx_beam_clash", "vfx_em_storm", "vfx_armor_melt"]
